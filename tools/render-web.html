<!doctype html><html><head><meta charset="utf-8"><title>render</title></head>
<body style="margin:0;background:#DDE3E6">
<!--
  Still-image renderer that needs no Node install. Serve the site folder with
  `python tools/render_server.py` and open
  http://localhost:8811/tools/render-web.html?out=hero.png&az=38&el=22&d=0.3
  The PNG (transparent background) is saved to tools/out/. Lighting mirrors
  assets/js/src/viewer.js so stills and the live 3D model match.
  Params: out, f (model file), w, h, az, el, d, ty, exposure, env, rimc, rim2c,
  sh (shadow), hide (comma list), explode, lift, stored=1, fov.
-->
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1600, H = +q.get('h') || 1200;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
r.setPixelRatio(1); r.setSize(W, H);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
r.toneMappingExposure = +(q.get('exposure') || 1.1);
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.domElement.style.width = '100%'; r.domElement.style.height = 'auto';
document.body.appendChild(r.domElement);
const s = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r);
s.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
s.environmentIntensity = +(q.get('env') || 1.1);
const key = new THREE.DirectionalLight(0xffffff, 2.6); key.position.set(0.25, 0.45, 0.3); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -0.2, right: 0.2, top: 0.2, bottom: -0.2, near: 0.05, far: 1.5 });
key.shadow.radius = 6; key.shadow.bias = -0.0004; s.add(key);
const rim = new THREE.DirectionalLight(new THREE.Color(q.get('rimc') || '#ffffff'), 2.6); rim.position.set(-0.3, 0.2, -0.3); s.add(rim);
const rim2 = new THREE.DirectionalLight(new THREE.Color(q.get('rim2c') || '#9a9fa3'), 1.2); rim2.position.set(0.35, 0.15, -0.25); s.add(rim2);
const fill = new THREE.DirectionalLight(0xffffff, 0.7); fill.position.set(-0.3, 0.1, 0.35); s.add(fill);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShadowMaterial({ opacity: +(q.get('sh') || 0.55) }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; s.add(floor);
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 30), W / H, 0.005, 10);
new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load('../public/assets/models/' + (q.get('f') || 'ct1.glb') + '?v=' + Date.now(), async (g) => {
  const m = g.scene;
  m.traverse((o) => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
  const hide = (q.get('hide') || '').split(',').filter(Boolean); if (!q.get('stored')) hide.push('storage_cover');
  m.traverse((o) => { if (hide.includes(o.name)) o.visible = false; });
  const ex = +(q.get('explode') || 0);
  if (ex) { const c = m.getObjectByName('cartridge'), cv = m.getObjectByName('cartridge_cover'), aw = m.getObjectByName('airway'); if (c) c.position.y += ex; if (aw) aw.position.y += ex; if (cv) cv.position.y += ex * 1.9; }
  const lf = +(q.get('lift') || 0); if (lf) { const cv = m.getObjectByName('cartridge_cover'); if (cv) cv.position.y += lf; }
  s.add(m);
  const az = +(q.get('az') || 38) * Math.PI / 180, el = +(q.get('el') || 22) * Math.PI / 180, d = +(q.get('d') || 0.3);
  const t = new THREE.Vector3(+(q.get('tx') || 0), +(q.get('ty') || 0.026), +(q.get('tz') || 0));
  cam.position.set(t.x + d * Math.cos(el) * Math.sin(az), t.y + d * Math.sin(el), t.z + d * Math.cos(el) * Math.cos(az)); cam.lookAt(t);
  r.render(s, cam);
  const pts = {};
  ['base', 'pad', 'cartridge', 'cartridge_cover', 'airway', 'nameplate'].forEach((n) => {
    const o = m.getObjectByName(n); if (!o || !o.visible) return;
    const c = new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3()).project(cam);
    pts[n] = [+((c.x + 1) / 2 * 100).toFixed(1), +((1 - c.y) / 2 * 100).toFixed(1)];
  });
  const out = q.get('out');
  if (out) {
    const blob = await new Promise((res) => r.domElement.toBlob(res, 'image/png'));
    await fetch('/save/' + encodeURIComponent(out), { method: 'POST', body: blob });
    await fetch('/save/' + encodeURIComponent(out.replace(/\.png$/, '.json')), { method: 'POST', body: JSON.stringify(pts) });
  }
  document.title = 'done ' + JSON.stringify(pts);
});
</script></body></html>
